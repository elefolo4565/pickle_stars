# https://elefolo2.com/games/pickle_stars/ で配信するための location 設定。
# 既存の elefolo2.com の server { ... } ブロック (listen 443 ssl のほう) の中で include する:
#
#     include /etc/nginx/snippets/pickle-stars.conf;
#
# クライアントは相対パス (vite base './') で作られているので、URL の末尾が / であれば
# アセットも WebSocket (/games/pickle_stars/ws) もそのまま動く。

# 末尾スラッシュなしで来たら付ける (付けないと ./assets や ws の解決先がずれる)
location = /games/pickle_stars {
    return 301 /games/pickle_stars/$is_args$args;
}

# ハッシュ付きファイルは長期キャッシュ
location ^~ /games/pickle_stars/assets/ {
    alias /opt/pickle-stars/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# ゲームサーバー (WebSocket)
location = /games/pickle_stars/ws {
    proxy_pass http://127.0.0.1:3000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 遅延を減らすためバッファリングしない
    proxy_buffering off;
    tcp_nodelay on;
}

location = /games/pickle_stars/healthz {
    proxy_pass http://127.0.0.1:3000/healthz;
}

# ビルド済みのクライアント (index.html / style.css など)
location ^~ /games/pickle_stars/ {
    alias /opt/pickle-stars/dist/;
    index index.html;
    add_header Cache-Control "no-cache";
}
